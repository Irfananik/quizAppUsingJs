<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">
        <header class="header">
            <h1>Quiz App ✅</h1>
            <div class="meta">
                <label for="playerName">Name</label>
                <input id="playerName" type="text" placeholder="Your name..." />
                <div class="status">
                    <div id="timer" class="timer">--:--</div>
                    <div id="score" class="score">Score: 0</div>
                </div>
            </div>
        </header>

        <main class="main">
            <section id="startScreen" class="card">
                <h2>Get ready for the quiz</h2>
                <p>Multiple choice and True/False questions. You can use number keys (1-4) or click to choose.</p>
                <button id="startBtn" class="btn primary">Start Quiz</button>
                <button id="resetBtn" class="btn">Reset</button>
                <button id="viewParticipantsBtn" class="btn">View Participants</button>
            </section>

            <section id="quizScreen" class="card hidden">
                <div id="progress" class="progress">Question <span id="qIndex">1</span>/<span id="totalQ">1</span></div>
                <div id="questionCard">
                    <h3 id="questionText">Question text</h3>
                    <form id="choicesForm"></form>
                </div>

                <div class="controls">
                    <button id="submitBtn" class="btn primary">Submit Answer</button>
                    <button id="nextBtn" class="btn" disabled>Next</button>
                </div>

                <div id="feedback" class="feedback" aria-live="polite"></div>
            </section>

            <section id="endScreen" class="card hidden">
                <h2>Quiz Complete 🎉</h2>
                <p id="finalMessage"></p>
                <p id="finalScore"></p>
                <button id="restartBtn" class="btn primary">Play Again</button>
                <button id="participantsBtn" class="btn">View Participants</button>
            </section>

        </main>

        <footer class="footer">
            <small>Built with JavaScript DOM APIs • Press 1-4 to select answers • Modern, responsive UI</small>
        </footer>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
